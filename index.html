<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Soul Audio Engine FIXED</title>

<script src="https://unpkg.com/wavesurfer.js@7"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
/* (기존 CSS 그대로 유지 - 생략 없이 사용 가능) */
</style>
</head>

<body>
<div class="container">
    <form id="upload-form">
        <div class="upload-area" id="drop-zone">
            <input type="file" id="audio-file" multiple>
            <div id="file-name-display">파일 업로드</div>
        </div>

        <select id="quality-preset">
            <option value="music_balanced">음악 밸런스</option>
            <option value="voice_clean">음성</option>
        </select>

        <div id="dsp-chain">
            <div class="toggle-container" data-module="highpass">
                <input type="checkbox" id="opt-highpass" checked>
                <input type="range" id="val-highpass" value="75">
            </div>

            <div class="toggle-container" data-module="limiter">
                <input type="checkbox" id="opt-limiter" checked>
                <input type="range" id="val-limiter" value="50">
            </div>
        </div>

        <button id="submit-btn" disabled>START</button>
    </form>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {

let lastFiles = [];
let audioCtx;
let results = [];

const el = {
    drop: document.getElementById('drop-zone'),
    input: document.getElementById('audio-file'),
    name: document.getElementById('file-name-display'),
    btn: document.getElementById('submit-btn')
};

/* =========================
   FILE HANDLING FIX
========================= */

el.drop.addEventListener('click', () => el.input.click());

el.input.addEventListener('change', (e) => {
    lastFiles = Array.from(e.target.files);
    el.name.textContent = `${lastFiles.length} files`;
    el.btn.disabled = lastFiles.length === 0;
});

el.drop.addEventListener('dragover', e => e.preventDefault());

el.drop.addEventListener('drop', e => {
    e.preventDefault();
    lastFiles = Array.from(e.dataTransfer.files);
    el.name.textContent = `${lastFiles.length} files`;
    el.btn.disabled = false;
});

/* =========================
   PRESET FIX
========================= */

document.getElementById('quality-preset')
.addEventListener('change', e => {

    const preset = e.target.value;

    console.log("preset:", preset);
});

/* =========================
   RMS FIXED
========================= */

function calculateRMS(buffer) {
    const data = buffer.getChannelData(0);
    let sum = 0;

    for (let i = 0; i < data.length; i++) {
        sum += data[i] * data[i];
    }

    return Math.sqrt(sum / data.length);
}

/* =========================
   OFFLINE CONTEXT
========================= */

function createOfflineContext(ch, len, sr) {
    return new (window.OfflineAudioContext ||
                window.webkitOfflineAudioContext)(ch, len, sr);
}

/* =========================
   DSP ENGINE (FIXED LIMITER)
========================= */

async function runDSP(buffer) {

    const off = createOfflineContext(
        buffer.numberOfChannels,
        buffer.length,
        buffer.sampleRate
    );

    const src = off.createBufferSource();
    src.buffer = buffer;

    let node = src;

    const limiter = off.createDynamicsCompressor();
    limiter.threshold.value = -1;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.001;
    limiter.release.value = 0.05;

    node.connect(limiter);
    limiter.connect(off.destination);

    src.start();

    const rendered = await off.startRendering();

    /* SAFE NORMALIZATION FIX */
    let max = 0;

    for (let c = 0; c < rendered.numberOfChannels; c++) {
        const d = rendered.getChannelData(c);
        for (let i = 0; i < d.length; i++) {
            max = Math.max(max, Math.abs(d[i]));
        }
    }

    if (max > 0.9) {
        const gain = 0.85 / max;

        for (let c = 0; c < rendered.numberOfChannels; c++) {
            const d = rendered.getChannelData(c);
            for (let i = 0; i < d.length; i++) {
                d[i] *= gain;
            }
        }
    }

    return rendered;
}

/* =========================
   SUBMIT FIX
========================= */

document.getElementById('upload-form')
.addEventListener('submit', async (e) => {

    e.preventDefault();

    if (!lastFiles.length) return;

    if (!audioCtx) {
        audioCtx = new AudioContext();
    }

    results = [];

    for (const file of lastFiles) {

        const buffer = await audioCtx.decodeAudioData(
            await file.arrayBuffer()
        );

        const processed = await runDSP(buffer);

        results.push(processed);
    }

    alert("DONE");
});

});
</script>
</body>
</html>
